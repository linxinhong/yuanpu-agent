name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-artifacts:
    uses: ./.github/workflows/runtime-bundle.yml
    with:
      artifact-prefix: yuanpu-agent-native
      retention-days: 7

  desktop-artifacts:
    uses: ./.github/workflows/desktop-bundle.yml
    with:
      artifact-prefix: yuanpu-agent-desktop
      retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - native-artifacts
      - desktop-artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: yuanpu-agent-native-*
          path: dist-release
          merge-multiple: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: yuanpu-agent-desktop-*
          path: dist-release
          merge-multiple: true

      - name: Produce update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node apps/runtime/scripts/native/produce-manifest.mjs dist-release "$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist-release/* --generate-notes --verify-tag
