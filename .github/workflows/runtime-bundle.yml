name: Runtime Bundle

on:
  workflow_dispatch:
    inputs:
      artifact-prefix:
        description: Prefix for uploaded artifact names
        required: false
        type: string
        default: yuanpu-agent-native
      retention-days:
        description: Artifact retention in days
        required: false
        type: number
        default: 3
  workflow_call:
    inputs:
      artifact-prefix:
        description: Prefix for uploaded artifact names
        required: false
        type: string
        default: yuanpu-agent-native
      retention-days:
        description: Artifact retention in days
        required: false
        type: number
        default: 7
    secrets:
      YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64:
        required: false
      YUANPU_ARTIFACT_SIGNING_KEY_ID:
        required: false

permissions:
  contents: read

jobs:
  native-bundle:
    name: Native bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-14
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.4.25'

      - name: Verify runner architecture
        shell: bash
        run: test "$(node -p "process.platform + '-' + process.arch")" = "${{ matrix.target }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile

      - name: Test managed MCP lifecycle
        run: |
          pnpm prepare:python-capabilities
          pnpm --filter @yuanpu-agent/runtime-kit run build
          pnpm --filter @yuanpu-agent/runtime-kit test

      - name: Build self-contained Python capability
        env:
          YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64: ${{ secrets.YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64 }}
          YUANPU_ARTIFACT_SIGNING_KEY_ID: ${{ secrets.YUANPU_ARTIFACT_SIGNING_KEY_ID }}
        run: |
          pnpm build:python-artifact
          pnpm smoke:python-artifact

      - name: Build native executable
        run: pnpm build:native

      - name: Smoke test native executable
        # The Python artifact was built and smoked above. Use the package-level
        # entry here to avoid rebuilding it; the root command stays standalone
        # for local clean-checkout verification.
        run: |
          pnpm --filter @yuanpu-agent/runtime run smoke:native
          pnpm smoke:runtime-update

      - name: Package native artifact
        run: pnpm package:native

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          path: |
            apps/runtime/dist-native/artifacts/YuanpuAgentRuntime-${{ matrix.target }}*
            apps/python-capabilities/dist-artifact/YuanpuEchoMcp-${{ matrix.target }}.tar.gz
            apps/python-capabilities/dist-artifact/YuanpuEchoMcp-${{ matrix.target }}.tar.gz.sha256
