name: Desktop Bundle

on:
  workflow_dispatch:
    inputs:
      artifact-mode:
        description: Upload installers directly or as a grouped release artifact
        required: false
        type: choice
        options:
          - direct
          - grouped
        default: direct
      artifact-prefix:
        description: Prefix for uploaded artifact names
        required: false
        type: string
        default: yuanpu-agent-desktop
      retention-days:
        description: Artifact retention in days
        required: false
        type: number
        default: 3
  workflow_call:
    inputs:
      artifact-mode:
        description: Upload installers directly or as a grouped release artifact
        required: false
        type: string
        default: grouped
      artifact-prefix:
        description: Prefix for uploaded artifact names
        required: false
        type: string
        default: yuanpu-agent-desktop
      retention-days:
        description: Artifact retention in days
        required: false
        type: number
        default: 7
    secrets:
      YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64:
        required: false
      YUANPU_ARTIFACT_SIGNING_KEY_ID:
        required: false

permissions:
  contents: read

jobs:
  desktop-bundle:
    name: Desktop bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-14
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.4.25'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile

      - name: Build desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64: ${{ secrets.YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64 }}
          YUANPU_ARTIFACT_SIGNING_KEY_ID: ${{ secrets.YUANPU_ARTIFACT_SIGNING_KEY_ID }}
        run: pnpm package:desktop

      - name: Verify packaged capability without system Python
        run: node apps/desktop/test/task-008-packaged-capability-probe.mjs

      - name: Upload grouped desktop artifact for release
        if: inputs.artifact-mode == 'grouped'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.yml
            apps/desktop/release/*.zip

      - name: Upload macOS DMG directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'darwin-arm64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-mac-arm64.dmg
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload macOS ZIP directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'darwin-arm64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-mac-arm64.zip
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload Windows installer directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'win32-x64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-win-x64.exe
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload Windows ZIP directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'win32-x64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-win-x64.zip
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload Linux AppImage directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-linux-x86_64.AppImage
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload Linux tarball directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-linux-x64.tar.gz
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
