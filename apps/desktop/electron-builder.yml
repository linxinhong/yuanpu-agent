appId: com.yuanpu.agent
productName: Yuanpu Agent
asar: true
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../app/dist
    to: app
    filter:
      - '**/*'
  - from: ../app/skills
    to: app/skills
    filter:
      - '**/*'
  - from: ../app/emo.json
    to: app/emo.json
  - from: ../app/src/assets/brand
    to: app/brand
    filter:
      - '*.png'
  - from: ../runtime/dist-native/bin
    to: runtime
    filter:
      - 'YuanpuAgentRuntime-*'
  - from: ../python-capabilities/dist-artifact/bundle
    to: capabilities/builtin.python.echo
    filter:
      - '**/*'
artifactName: 'YuanpuAgent-${version}-${os}-${arch}.${ext}'
executableName: YuanpuAgent
mac:
  icon: dist/emo-icon.png
  target:
    - dmg
    - zip
win:
  icon: dist/emo-icon.png
  target:
    - nsis
    - zip
linux:
  icon: dist/emo-icon.png
  target:
    - AppImage
    - tar.gz
publish:
  provider: github
  owner: linxinhong
  repo: yuanpu-agent
